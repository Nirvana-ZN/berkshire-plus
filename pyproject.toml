[project]
name = "berkshire-plus"
version = "0.1.0"
description = "本机价值投资工作台"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "PyYAML==6.0.2",
    "httpx2==2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx==0.28.1",
]

[project.scripts]
berkshire-plus = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "discovery", "ledger", "migrate", "market", "screen", "jobs", "research", "review", "tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
